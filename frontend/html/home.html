<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>azma | home page</title>

<link rel="stylesheet" href="../css/home.css">
<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

<!-- ================= ADMIN MENU ================= -->
<div class="admin-menu">
  <button class="admin-btn" onclick="toggleAdminMenu()">⋮</button>

  <div id="adminDropdown" class="admin-dropdown">
    <a href="../html/admin-login.html">Access Panel</a>
  </div>
</div>

<!-- ================= HEADER ================= -->
<header class="navbar">
  <h1>AZMA MARKETPLACE</h1>

  <button onclick="openCart()" class="cart-btn">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<!-- ================= MAIN ================= -->
<main>

<!-- HERO -->
<section class="hero">
  <h2>Buy & Sell Products Using Pi Coin</h2>
  <p>Fast • Secure • Transparent Marketplace</p>

  <input
    id="searchInput"
    type="text"
    placeholder="Search products..."
    autocomplete="off"
  />
</section>

<!-- STATUS -->
<div id="status" class="status">
  Loading products...
</div>

<!-- PRODUCTS -->
<section id="products" class="grid"></section>

</main>

<!-- ================= CART MODAL ================= -->
<div id="cartModal" class="cart-modal">

  <div class="cart-box">

    <h3>Your Cart</h3>

    <div id="cartItems"></div>

    <p>
      <b>Total:</b>
      <span id="cartTotal">0 Pi</span>
    </p>

    <button onclick="goToCheckout()">
      Proceed to Checkout
    </button>

    <button onclick="closeCart()">
      Close
    </button>

  </div>

</div>

<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-navigation">

  <button class="active" onclick="goHome()">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </button>

  <button onclick="goVendor()">
    <i class="fa-solid fa-store"></i>
    <span>Vendor</span>
  </button>

  <button onclick="goProfile()">
    <i class="fa-solid fa-user"></i>
    <span>Profile</span>
  </button>

</nav>

<!-- ================= HOME JS ================= -->
<script src="../js/home.js"></script>

</body>
</html>
